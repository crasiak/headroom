name: Security

# Security gate: dependency vulnerability scanning (SCA), static analysis
# (CodeQL/SAST), and secret scanning. Runs on every PR to main, on push to
# main, weekly (to catch newly-disclosed CVEs without a code change), and on
# demand. Each job is an independent required check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — surface CVEs disclosed since the last commit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---- SCA: dependency vulnerability scan -------------------------------
  # Audits the PRODUCTION dependency set ([all]) exported from uv.lock. The
  # `benchmark` extra is intentionally excluded from [all] (it pulls lm-eval's
  # sqlitedict/nltk, which carry unpatchable upstream High CVEs and are never
  # installed in production), so this gate fails only on actionable findings.
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Export production dependency set from uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes \
            --extra all --format requirements-txt > requirements-prod.txt
          echo "Production dependencies audited:"
          wc -l requirements-prod.txt

      - name: Audit dependencies (pip-audit)
        # Audit the complete frozen production closure without re-resolution.
        # Published metadata is independently resolved and audited below.
        run: uvx pip-audit==2.10.1 -r requirements-prod.txt --no-deps --disable-pip

  # ---- SCA: what `pip install headroom-ai[all]` gets ---------------------
  # pip ignores [tool.uv], so resolve and audit published metadata separately.
  # fastembed>=0.9.1 permits Pillow>=13; decoder_guard remains defense in depth,
  # never an advisory waiver. Python>=3.11 retains the fixed filelock floor.
  # `uv pip compile` approximates pip on Linux/Python 3.12, not every platform.
  # It resolves live from PyPI, so a new upstream advisory would fail PRs that
  # did not cause it: on pull requests it runs only when pyproject.toml changes;
  # pushes to main and the weekly schedule always run it.
  published-install-audit:
    name: Dependency audit (pip install from package metadata)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run on this event?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qx pyproject.toml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "pyproject.toml unchanged in this PR; main and the weekly run cover it."
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Resolve what pip installs from the package metadata
        if: steps.gate.outputs.run == 'true'
        run: |
          uv --no-config pip compile pyproject.toml --extra all --python-version 3.12 \
            --no-header --no-annotate -o published.txt
          uv --no-config pip compile pyproject.toml --python-version 3.12 \
            --no-header --no-annotate -o core.txt
          grep -iE '^(pillow|fastembed)==' published.txt

      - name: The decoder guard holds on that Pillow
        if: steps.gate.outputs.run == 'true'
        run: |
          uv venv -p 3.12 .published
          uv --no-config pip install -p .published -r core.txt \
            "$(grep -i '^pillow==' published.txt)" pytest pytest-asyncio
          .published/bin/python -m pytest -p no:cacheprovider tests/test_image_decoder_guard.py
          PINNED="$(grep -i '^pillow==' published.txt | cut -d= -f3)" .published/bin/python - <<'PY'
          import os

          import PIL
          from headroom.image.decoder_guard import FIXED_PILLOW_MAJOR, pillow_is_safe

          # The guard reads the Pillow that is imported; it must be pip's pick.
          assert PIL.__version__ == os.environ["PINNED"], (PIL.__version__, os.environ["PINNED"])
          fixed = int(PIL.__version__.split(".")[0]) >= FIXED_PILLOW_MAJOR
          assert pillow_is_safe() is fixed, (PIL.__version__, pillow_is_safe())
          print("Pillow", PIL.__version__, "decodes images:", fixed)
          PY

      - name: Audit it (pip-audit)
        if: steps.gate.outputs.run == 'true'
        run: |
          uvx pip-audit==2.10.1 -r published.txt --no-deps --disable-pip

  # ---- SCA: Rust dependency advisories -----------------------------------
  # `cargo audit` reads Cargo.lock only (no build, about a minute), so it runs
  # unconditionally: every PR, every push to main, and the weekly schedule
  # above. It used to live in rust.yml behind the `rust-changes` path filter;
  # pushes that touched no Rust path reported it `skipped`, and rust.yml's own
  # schedule stopped firing after 2026-09-08, so no advisory scan ran for three
  # weeks. Blocking: an accepted advisory goes in .cargo/audit.toml with a
  # written reason.
  cargo-audit:
    name: Rust advisories (cargo audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit + cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit (blocking; exceptions in .cargo/audit.toml)
        run: cargo audit

      # Licence allow-list from deny.toml. Advisory decisions stay with
      # cargo-audit above, so there is one place that decides what is accepted.
      - name: cargo deny check licenses
        continue-on-error: true
        run: cargo deny check licenses

  # Audit every maintained npm lock, including development dependencies.
  # Lockfile audits do not install packages or execute their lifecycle scripts.
  npm-audit:
    name: npm audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory:
          - docs
          - sdk/typescript
          - plugins/openclaw
          - plugins/opencode
          - e2e/wrap/tools
          - e2e/wrap/tools/npm-security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.16.0 <25"
      # Every maintained closure, including dev and npm's packed inventory.
      # No waiver file, severity reduction, or omitted dependency classes.
      - name: Audit locked dependencies at every severity
        working-directory: ${{ matrix.directory }}
        run: npm audit --package-lock-only --audit-level=low

  # Pure-JS source packaging only: no provider/model calls or runtime rollout.
  security-npm-bundle:
    name: Patched npm reproducibility and offline CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Fetch the integrity-pinned native build toolchain
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, tarfile, urllib.request
          recipe = json.loads(pathlib.Path('e2e/wrap/tools/npm-security/recipe.json').read_text())
          name = 'node-v24.22.2-linux-x64.tar.gz'
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / name
          with urllib.request.urlopen('https://nodejs.org/dist/v24.22.2/' + name, timeout=60) as response:
              archive.write_bytes(response.read())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == recipe['node_distributions'][name]
          with tarfile.open(archive, 'r:gz') as source:
              source.extractall(archive.parent, filter='data')
          PY
      - name: Build twice from clean source and reviewed lock
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/node-v24.22.2-linux-x64"
          for attempt in first second; do
            python scripts/build_security_npm.py \
              --work-dir "$RUNNER_TEMP/npm-build-$attempt" \
              --output-dir "$RUNNER_TEMP/npm-dist-$attempt" \
              --node "$tool/bin/node" \
              --npm-cli "$tool/lib/node_modules/npm/bin/npm-cli.js" \
              --node-distribution "$RUNNER_TEMP/node-v24.22.2-linux-x64.tar.gz"
          done
          cmp "$RUNNER_TEMP/npm-dist-first/npm-12.2.1-crasiak.1.tgz" \
              "$RUNNER_TEMP/npm-dist-second/npm-12.2.1-crasiak.1.tgz"
          sha256sum "$RUNNER_TEMP/npm-dist-first/npm-12.2.1-crasiak.1.tgz"
          python - "$RUNNER_TEMP/npm-dist-first/artifact.json" <<'PY'
          import json, pathlib, sys
          actual = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = json.loads(pathlib.Path('e2e/wrap/tools/npm-security/artifact.json').read_text())
          # Actual bootstrap archive differs by platform; shipped bytes must not.
          for field in ('sha256', 'integrity', 'builder_sha256', 'recipe_sha256', 'lock_sha256'):
              assert actual[field] == expected[field], f'canonical artifact mismatch: {field}'
          PY
      - name: Materialize packed artifact and exercise offline CLI consumers
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/node-v24.22.2-linux-x64"
          consumer="$RUNNER_TEMP/npm-consumer"
          mkdir -p "$consumer" "$RUNNER_TEMP/npm-smoke-home"
          python - "$consumer" "$RUNNER_TEMP/npm-dist-first/npm-12.2.1-crasiak.1.tgz" <<'PY'
          import json, pathlib, sys
          (pathlib.Path(sys.argv[1]) / 'package.json').write_text(json.dumps({
              'name': 'security-npm-smoke', 'version': '1.0.0', 'private': True,
              'dependencies': {'npm': 'file:' + sys.argv[2]}
          }))
          PY
          touch "$consumer/user.npmrc" "$consumer/global.npmrc"
          env -i PATH="$tool/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/npm-smoke-home" \
            NPM_CONFIG_USERCONFIG="$consumer/user.npmrc" \
            NPM_CONFIG_GLOBALCONFIG="$consumer/global.npmrc" \
            "$tool/bin/node" "$tool/lib/node_modules/npm/bin/npm-cli.js" \
            install --prefix "$consumer" --ignore-scripts --offline --no-audit --no-fund
          env -i PATH="$tool/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/npm-smoke-home" \
            NPM_CONFIG_USERCONFIG="$consumer/user.npmrc" \
            NPM_CONFIG_GLOBALCONFIG="$consumer/global.npmrc" \
            SECURITY_NPM_PACKAGE="$consumer/node_modules/npm" \
            SECURITY_NPM_LOCK="$GITHUB_WORKSPACE/e2e/wrap/tools/npm-security/package-lock.json" \
            "$tool/bin/node" --test scripts/test_security_npm.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cra-1534-npm-source-artifact
          path: |
            ${{ runner.temp }}/npm-dist-first/npm-12.2.1-crasiak.1.tgz
            ${{ runner.temp }}/npm-dist-first/artifact.json

  # ---- SAST: CodeQL static analysis ------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Test code never ships. Its alerts were all test idioms (asserting a
          # URL appears in output, a fake server binding 0.0.0.0), so scanning
          # it only buried the real findings.
          config: |
            paths-ignore:
              - tests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  # ---- Secret scanning -------------------------------------------------
  # Uses the gitleaks BINARY (MIT-licensed, no key) instead of
  # gitleaks-action, which requires a paid GITLEAKS_LICENSE for organization
  # repos. On PRs we scan only the PR's commits so pre-existing history can't
  # block a PR; on push/schedule we scan the working tree. Config + allowlist
  # live in .gitleaks.toml at the repo root (auto-loaded).
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.18.4
          # SHA-256 of gitleaks_8.18.4_linux_x64.tar.gz from the release's
          # gitleaks_8.18.4_checksums.txt. Update both lines together.
          sha256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${sha256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            echo "Scanning PR commits ${BASE_SHA}..HEAD"
            gitleaks detect --source . --log-opts="${BASE_SHA}..HEAD" --redact --no-banner
          else
            echo "Scanning working tree"
            gitleaks detect --source . --no-git --redact --no-banner
          fi

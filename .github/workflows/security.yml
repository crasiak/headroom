name: Security

# Security gate: dependency vulnerability scanning (SCA), static analysis
# (CodeQL/SAST), and secret scanning. Runs on every PR to main, on push to
# main, weekly (to catch newly-disclosed CVEs without a code change), and on
# demand. Each job is an independent required check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — surface CVEs disclosed since the last commit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---- SCA: dependency vulnerability scan -------------------------------
  # Audits the PRODUCTION dependency set ([all]) exported from uv.lock. The
  # `benchmark` extra is intentionally excluded from [all] (it pulls lm-eval's
  # sqlitedict/nltk, which carry unpatchable upstream High CVEs and are never
  # installed in production), so this gate fails only on actionable findings.
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Export production dependency set from uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes \
            --extra all --format requirements-txt > requirements-prod.txt
          echo "Production dependencies audited:"
          wc -l requirements-prod.txt

      - name: Audit dependencies (pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-prod.txt

  # Audit every maintained npm lock, including development dependencies.
  # Lockfile audits do not install packages or execute their lifecycle scripts.
  npm-audit:
    name: npm audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory:
          - docs
          - sdk/typescript
          - plugins/openclaw
          - plugins/opencode
          - e2e/wrap/tools
          - e2e/wrap/tools/npm-security
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ">=24.16.0 <25"
      - name: Audit locked dependencies at every severity
        working-directory: ${{ matrix.directory }}
        run: npm audit --package-lock-only --audit-level=low

  # Pure-JS source packaging only: no provider/model calls or runtime rollout.
  security-npm-bundle:
    name: Patched npm reproducibility and offline CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch the integrity-pinned native build toolchain
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, tarfile, urllib.request
          recipe = json.loads(pathlib.Path('e2e/wrap/tools/npm-security/recipe.json').read_text())
          name = 'node-v24.22.2-linux-x64.tar.gz'
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / name
          with urllib.request.urlopen('https://nodejs.org/dist/v24.22.2/' + name, timeout=60) as response:
              archive.write_bytes(response.read())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == recipe['node_distributions'][name]
          with tarfile.open(archive, 'r:gz') as source:
              source.extractall(archive.parent, filter='data')
          PY
      - name: Build twice from clean source and reviewed lock
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/node-v24.22.2-linux-x64"
          for attempt in first second; do
            python scripts/build_security_npm.py \
              --work-dir "$RUNNER_TEMP/npm-build-$attempt" \
              --output-dir "$RUNNER_TEMP/npm-dist-$attempt" \
              --node "$tool/bin/node" \
              --npm-cli "$tool/lib/node_modules/npm/bin/npm-cli.js" \
              --node-distribution "$RUNNER_TEMP/node-v24.22.2-linux-x64.tar.gz"
          done
          cmp "$RUNNER_TEMP/npm-dist-first/npm-12.2.1-crasiak.1.tgz" \
              "$RUNNER_TEMP/npm-dist-second/npm-12.2.1-crasiak.1.tgz"
          sha256sum "$RUNNER_TEMP/npm-dist-first/npm-12.2.1-crasiak.1.tgz"
          python - "$RUNNER_TEMP/npm-dist-first/artifact.json" <<'PY'
          import json, pathlib, sys
          actual = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = json.loads(pathlib.Path('e2e/wrap/tools/npm-security/artifact.json').read_text())
          # Actual bootstrap archive differs by platform; shipped bytes must not.
          for field in ('sha256', 'integrity', 'builder_sha256', 'recipe_sha256', 'lock_sha256'):
              assert actual[field] == expected[field], f'canonical artifact mismatch: {field}'
          PY
      - name: Materialize packed artifact and exercise offline CLI consumers
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/node-v24.22.2-linux-x64"
          consumer="$RUNNER_TEMP/npm-consumer"
          mkdir -p "$consumer" "$RUNNER_TEMP/npm-smoke-home"
          python - "$consumer" "$RUNNER_TEMP/npm-dist-first/npm-12.2.1-crasiak.1.tgz" <<'PY'
          import json, pathlib, sys
          (pathlib.Path(sys.argv[1]) / 'package.json').write_text(json.dumps({
              'name': 'security-npm-smoke', 'version': '1.0.0', 'private': True,
              'dependencies': {'npm': 'file:' + sys.argv[2]}
          }))
          PY
          touch "$consumer/user.npmrc" "$consumer/global.npmrc"
          env -i PATH="$tool/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/npm-smoke-home" \
            NPM_CONFIG_USERCONFIG="$consumer/user.npmrc" \
            NPM_CONFIG_GLOBALCONFIG="$consumer/global.npmrc" \
            "$tool/bin/node" "$tool/lib/node_modules/npm/bin/npm-cli.js" \
            install --prefix "$consumer" --ignore-scripts --offline --no-audit --no-fund
          env -i PATH="$tool/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/npm-smoke-home" \
            NPM_CONFIG_USERCONFIG="$consumer/user.npmrc" \
            NPM_CONFIG_GLOBALCONFIG="$consumer/global.npmrc" \
            SECURITY_NPM_PACKAGE="$consumer/node_modules/npm" \
            SECURITY_NPM_LOCK="$GITHUB_WORKSPACE/e2e/wrap/tools/npm-security/package-lock.json" \
            "$tool/bin/node" --test scripts/test_security_npm.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: cra-1534-npm-source-artifact
          path: |
            ${{ runner.temp }}/npm-dist-first/npm-12.2.1-crasiak.1.tgz
            ${{ runner.temp }}/npm-dist-first/artifact.json

  # ---- SAST: CodeQL static analysis ------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ---- Secret scanning -------------------------------------------------
  # Uses the gitleaks BINARY (MIT-licensed, no key) instead of
  # gitleaks-action, which requires a paid GITLEAKS_LICENSE for organization
  # repos. On PRs we scan only the PR's commits so pre-existing history can't
  # block a PR; on push/schedule we scan the working tree. Config + allowlist
  # live in .gitleaks.toml at the repo root (auto-loaded).
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.18.4
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            echo "Scanning PR commits ${BASE_SHA}..HEAD"
            gitleaks detect --source . --log-opts="${BASE_SHA}..HEAD" --redact --no-banner
          else
            echo "Scanning working tree"
            gitleaks detect --source . --no-git --redact --no-banner
          fi

name: Changelog Guard

# Local release entries belong to release-please. A history-preserving sync may
# copy the generated changelog from an upstream commit merged into the branch.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  no-manual-changelog:
    # release-please's release PR is the sole author of CHANGELOG.md.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify generated upstream history or reject manual edits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --no-recurse-submodules https://github.com/headroomlabs-ai/headroom.git main
          upstream=$(git rev-parse FETCH_HEAD)
          python scripts/check_changelog.py "$BASE" "$HEAD" "$upstream"
